<!DOCTYPE html>
<html>
    <head>
        <title>Practice</title>
        <style>
            p {
                font-family: Arial;
                margin-top: 0px;
                margin-bottom: 0px;
            }
            .container{
                margin-left: 40px;
                width: 200px;
                box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
            }
            
            .dog-picture {
                width: 200px;
                height: 200px;
                object-fit: cover;
                object-position: center;
            }

            .dog-name {
                font-weight: bold;
                padding-left: 10px;
                margin-top: 10px;
                font-size: 18px;
            }

            .mutual-friend {
                padding-left: 10px;
                margin-top: 8px;
                margin-bottom: 16px;
                font-size: 16px;
                color: rgb(120, 120, 120);
                display: inline-block;
            }

            .add-friend {
                margin-left: 10px;
                margin-bottom: 10px;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left: 20px;
                padding-right: 20px;
                font-size: 16px;
                background-color: rgb(24, 119, 242);
                color: white;
                border: none;
                border-radius: 4px;
            }

            .mutual-friend-row {
                margin-left: 8px;
                margin-top: 10px;
                margin-bottom: 20px;
            }
            
            .mutual-friend-picture {
                width: 40px;
                height: 40px;
                border-radius: 35px;
                object-fit: cover;
                object-position: center;
                vertical-align: middle;
            }

        </style>
    </head>
    <body>
      <div class="container">
        <img class="dog-picture" src="dog.jpg">
        <p class="dog-name">Oliver</p>
      
      <div>
            <div class="mutual-friend-row">
                <img class="mutual-friend-picture" src="dog.jpg">
                <p class="mutual-friend">
                    2 Mutual Friends
                </p>
            </div>

            <button class="add-friend">
                Add Friend
            </button>
      </div>
      </div>
    </body>
</html>
