<!DOCTYPE html>
<html>
    <head>
        <style>
            p {
                font-family: Arial;
            }

            .title {
                font-size: 40px;
                margin-bottom: 25px;
            }

            input {
                display: block;
                width: 400px;
                padding-top: 14px;
                padding-bottom: 14px;
                padding-left: 20px;
                padding-right: 20px;
                font-size: 16px;
                border: none;
                background-color: rgb(240, 240, 240);
            }

            .location {
                margin-bottom: 6px;
            }

            .destination {
                margin-bottom: 20px;
            }

            .request-button {
                background-color: black;
                color: white;
                border: none;
                padding-top: 15px;
                padding-bottom: 15px;
                padding-left: 25px;
                padding-right: 25px;
                font-size: 16px;
            }

            .schedule-button {
                background-color: rgb(240, 240, 240);
                border: none;
                padding-top: 15px;
                padding-bottom: 15px;
                padding-left: 25px;
                padding-right: 25px;
                margin-left: 20px;
                font-size: 16px;
            }
        </style>
    </head>
    <body>
        
        <p class="title">
            Request a ride now
        </p>

        <input class="location" type="text" placeholder="Enter pickup location">
        <input class="destination" type="text" placeholder="Enter destination">
        <button class="request-button">
            Request now
        </button>
        <button class="schedule-button">
            Schedule for later
        </button>
    </body>
</html>
